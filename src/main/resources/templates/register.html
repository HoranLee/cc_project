<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Demo</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card auth-card--wide">
        <!-- 头部 -->
        <div class="auth-header">
            <h1 class="auth-title">创建账号</h1>
            <p class="auth-subtitle">填写以下信息完成注册</p>
        </div>

        <!-- 全局错误提示 -->
        <div id="globalError" class="error-message" style="display: none;">
            <span class="error-icon">!</span>
            <span id="globalErrorText"></span>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm" class="auth-form" novalidate>
            <!-- 用户名 -->
            <div class="form-group">
                <label for="username" class="form-label">用户名 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="4~20位字母/数字/下划线，字母开头" autocomplete="username" maxlength="20">
                    <span id="usernameSpinner" class="input-spinner" style="display: none;"></span>
                    <span id="usernameCheck" class="input-check" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-ok"><polyline points="20 6 9 17 4 12"/></svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-fail"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <span class="field-error" id="usernameError"></span>
            </div>

            <!-- 邮箱 -->
            <div class="form-group">
                <label for="email" class="form-label">邮箱 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="email" name="email" class="form-input"
                           placeholder="请输入邮箱地址" autocomplete="email">
                    <span id="emailSpinner" class="input-spinner" style="display: none;"></span>
                    <span id="emailCheck" class="input-check" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-ok"><polyline points="20 6 9 17 4 12"/></svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-fail"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <span class="field-error" id="emailError"></span>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="password" class="form-label">密码 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="至少8位，包含字母和数字" autocomplete="new-password">
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="切换密码可见性">
                        <svg id="eyeOff" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                        <svg id="eyeOn" class="eye-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <!-- 密码强度指示器 -->
                <div class="password-strength" id="passwordStrength" style="display: none;">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                </div>
                <span class="field-error" id="passwordError"></span>
            </div>

            <!-- 确认密码 -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">确认密码 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                           placeholder="请再次输入密码" autocomplete="new-password">
                    <span id="confirmCheck" class="input-check" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-ok"><polyline points="20 6 9 17 4 12"/></svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="check-icon check-fail"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <span class="field-error" id="confirmPasswordError"></span>
            </div>

            <!-- 昵称 -->
            <div class="form-group">
                <label for="nickname" class="form-label">昵称 <span class="optional">(选填)</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="nickname" name="nickname" class="form-input"
                           placeholder="显示用昵称，为空时默认取用户名" maxlength="20">
                </div>
            </div>

            <!-- 用户协议 -->
            <label class="checkbox-label agreement-label">
                <input type="checkbox" id="agreed" name="agreed">
                <span class="checkmark"></span>
                我已阅读并同意 <a href="#" class="link">《用户协议》</a>
            </label>

            <!-- 提交按钮 -->
            <button type="submit" id="registerButton" class="btn-primary" disabled>
                <span id="buttonText">注 册</span>
                <span id="buttonLoader" class="loader" style="display: none;"></span>
            </button>
        </form>

        <!-- 底部链接 -->
        <div class="auth-footer">
            <p>已有账号？<a href="/login" class="link">立即登录</a></p>
        </div>
    </div>
</div>

<!-- 成功弹窗 -->
<div id="successModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-body">
            <svg class="modal-icon success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="16 10 10.5 15.5 8 12.5"/>
            </svg>
            <p class="modal-text">注册成功！即将跳转到登录页...</p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    (function() {
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerButton');
        const buttonText = document.getElementById('buttonText');
        const buttonLoader = document.getElementById('buttonLoader');
        const globalError = document.getElementById('globalError');
        const globalErrorText = document.getElementById('globalErrorText');
        const successModal = document.getElementById('successModal');

        // 输入框引用
        const usernameEl = document.getElementById('username');
        const emailEl = document.getElementById('email');
        const passwordEl = document.getElementById('password');
        const confirmPasswordEl = document.getElementById('confirmPassword');
        const nicknameEl = document.getElementById('nickname');
        const agreedEl = document.getElementById('agreed');

        let isSubmitting = false;
        let checkTimers = { username: null, email: null };

        // ---- 密码显隐切换 ----
        document.getElementById('togglePassword').addEventListener('click', function() {
            const isPassword = passwordEl.type === 'password';
            passwordEl.type = isPassword ? 'text' : 'password';
            confirmPasswordEl.type = isPassword ? 'text' : 'password';
            document.getElementById('eyeOff').style.display = isPassword ? 'none' : 'block';
            document.getElementById('eyeOn').style.display = isPassword ? 'block' : 'none';
        });

        // ---- 实时校验：用户名 ----
        usernameEl.addEventListener('input', function() {
            clearTimeout(checkTimers.username);
            toggleCheckIcon('usernameCheck', null);
            const val = usernameEl.value.trim();
            const errEl = document.getElementById('usernameError');

            // 格式校验
            if (val && !/^[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(val)) {
                showFieldError(errEl, '用户名格式：4~20位，字母/数字/下划线，字母开头');
                updateButtonState();
                return;
            }
            if (!val) {
                hideFieldError(errEl);
                toggleCheckIcon('usernameCheck', null);
                updateButtonState();
                return;
            }

            checkTimers.username = setTimeout(() => {
                showSpinner('usernameSpinner');
                fetch('/api/auth/check-availability?type=username&value=' + encodeURIComponent(val))
                    .then(r => r.json())
                    .then(data => {
                        hideSpinner('usernameSpinner');
                        if (data.available) {
                            toggleCheckIcon('usernameCheck', true);
                            hideFieldError(errEl);
                        } else {
                            toggleCheckIcon('usernameCheck', false);
                            showFieldError(errEl, data.message || '用户名不可用');
                        }
                        updateButtonState();
                    });
            }, 500);
        });

        // ---- 实时校验：邮箱 ----
        emailEl.addEventListener('input', function() {
            clearTimeout(checkTimers.email);
            toggleCheckIcon('emailCheck', null);
            const val = emailEl.value.trim();
            const errEl = document.getElementById('emailError');

            if (val && !/^[\w.-]+@[\w.-]+\.\w{2,}$/.test(val)) {
                showFieldError(errEl, '邮箱格式错误');
                updateButtonState();
                return;
            }
            if (!val) {
                hideFieldError(errEl);
                toggleCheckIcon('emailCheck', null);
                updateButtonState();
                return;
            }

            checkTimers.email = setTimeout(() => {
                showSpinner('emailSpinner');
                fetch('/api/auth/check-availability?type=email&value=' + encodeURIComponent(val))
                    .then(r => r.json())
                    .then(data => {
                        hideSpinner('emailSpinner');
                        if (data.available) {
                            toggleCheckIcon('emailCheck', true);
                            hideFieldError(errEl);
                        } else {
                            toggleCheckIcon('emailCheck', false);
                            showFieldError(errEl, data.message || '邮箱不可用');
                        }
                        updateButtonState();
                    });
            }, 500);
        });

        // ---- 实时校验：密码强度 ----
        passwordEl.addEventListener('input', function() {
            const val = passwordEl.value;
            const strengthEl = document.getElementById('passwordStrength');
            const fillEl = document.getElementById('strengthFill');
            const textEl = document.getElementById('strengthText');
            const errEl = document.getElementById('passwordError');

            if (!val) {
                strengthEl.style.display = 'none';
                hideFieldError(errEl);
                updateButtonState();
                return;
            }

            strengthEl.style.display = 'flex';
            let strength = 0;
            // 长度>=8
            if (val.length >= 8) strength++;
            // 包含字母
            if (/[a-zA-Z]/.test(val)) strength++;
            // 包含数字
            if (/\d/.test(val)) strength++;
            // 包含特殊字符
            if (/[^a-zA-Z0-9]/.test(val)) strength++;
            // 长度>=10
            if (val.length >= 10) strength++;

            let level, color, width;
            if (strength <= 2) {
                level = '弱'; color = '#e74c3c'; width = '33%';
            } else if (strength <= 3) {
                level = '中'; color = '#f39c12'; width = '66%';
            } else {
                level = '强'; color = '#27ae60'; width = '100%';
            }

            fillEl.style.width = width;
            fillEl.style.background = color;
            textEl.textContent = level;
            textEl.style.color = color;
            updateButtonState();
        });

        // ---- 实时校验：确认密码 ----
        confirmPasswordEl.addEventListener('input', function() {
            const val = confirmPasswordEl.value;
            const errEl = document.getElementById('confirmPasswordError');

            if (!val) {
                toggleCheckIcon('confirmCheck', null);
                hideFieldError(errEl);
                updateButtonState();
                return;
            }

            if (val === passwordEl.value) {
                toggleCheckIcon('confirmCheck', true);
                hideFieldError(errEl);
            } else {
                toggleCheckIcon('confirmCheck', false);
                showFieldError(errEl, '两次密码输入不一致');
            }
            updateButtonState();
        });

        // ---- 协议勾选 ----
        agreedEl.addEventListener('change', updateButtonState);

        // ---- 更新注册按钮状态 ----
        function updateButtonState() {
            const username = usernameEl.value.trim();
            const email = emailEl.value.trim();
            const password = passwordEl.value;
            const confirmPwd = confirmPasswordEl.value;
            const agreed = agreedEl.checked;

            const usernameOk = username && /^[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(username)
                               && !document.getElementById('usernameError').classList.contains('visible');
            const emailOk = email && /^[\w.-]+@[\w.-]+\.\w{2,}$/.test(email)
                           && !document.getElementById('emailError').classList.contains('visible');
            const passwordOk = password && /^(?=.*[a-zA-Z])(?=.*\d).{8,}$/.test(password);
            const confirmOk = confirmPwd && confirmPwd === password;

            const allOk = usernameOk && emailOk && passwordOk && confirmOk && agreed;
            registerBtn.disabled = !allOk;
        }

        // ---- 表单提交 ----
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (isSubmitting || registerBtn.disabled) return;

            clearErrors();
            setLoading(true);

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usernameEl.value.trim(),
                    email: emailEl.value.trim(),
                    password: passwordEl.value,
                    nickname: nicknameEl.value.trim(),
                    agreed: agreedEl.checked
                })
            })
            .then(response => response.json())
            .then(data => {
                setLoading(false);
                if (data.code === 200) {
                    // 注册成功
                    successModal.style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = '/login?registered=1';
                    }, 2000);
                } else {
                    handleError(data);
                }
            })
            .catch(err => {
                setLoading(false);
                showGlobalError('网络异常，请稍后再试');
                console.error('Register error:', err);
            });
        });

        // 回车键提交
        form.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !registerBtn.disabled) {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ---- 错误处理 ----
        function handleError(data) {
            switch (data.code) {
                case 1001:
                    showFieldError(document.getElementById('usernameError'), '用户名已存在');
                    toggleCheckIcon('usernameCheck', false);
                    break;
                case 1002:
                    showFieldError(document.getElementById('emailError'), '邮箱已注册');
                    toggleCheckIcon('emailCheck', false);
                    break;
                case 1003:
                    showFieldError(document.getElementById('passwordError'), '密码强度不足：至少8位，包含字母和数字');
                    break;
                case 1004:
                    showFieldError(document.getElementById('usernameError'), '用户名格式错误：需4~20位字母/数字/下划线，字母开头');
                    break;
                case 1005:
                    showFieldError(document.getElementById('emailError'), '邮箱格式错误');
                    break;
                case 1006:
                    showGlobalError('请先同意用户协议');
                    break;
                case 1007:
                    showGlobalError('注册过于频繁，请稍后再试');
                    break;
                default:
                    showGlobalError(data.message || '注册失败，请稍后再试');
            }
            updateButtonState();
        }

        // ---- UI 辅助函数 ----
        function setLoading(loading) {
            isSubmitting = loading;
            registerBtn.disabled = loading;
            buttonText.style.display = loading ? 'none' : 'inline';
            buttonLoader.style.display = loading ? 'inline-block' : 'none';
        }

        function showFieldError(el, msg) {
            el.textContent = msg;
            el.classList.add('visible');
        }

        function hideFieldError(el) {
            el.textContent = '';
            el.classList.remove('visible');
        }

        function showGlobalError(msg) {
            globalErrorText.textContent = msg;
            globalError.style.display = 'flex';
            globalError.classList.add('shake');
            setTimeout(() => globalError.classList.remove('shake'), 500);
        }

        function clearErrors() {
            globalError.style.display = 'none';
            document.querySelectorAll('.field-error').forEach(el => {
                el.textContent = '';
                el.classList.remove('visible');
            });
        }

        function toggleCheckIcon(id, ok) {
            const container = document.getElementById(id);
            if (container) {
                if (ok === null) {
                    container.style.display = 'none';
                } else {
                    container.style.display = 'block';
                    container.querySelector('.check-ok').style.display = ok ? 'block' : 'none';
                    container.querySelector('.check-fail').style.display = ok ? 'none' : 'block';
                }
            }
        }

        function showSpinner(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'block';
            // 同时隐藏对应的 check icon
            const checkId = id.replace('Spinner', 'Check');
            const checkEl = document.getElementById(checkId);
            if (checkEl) checkEl.style.display = 'none';
        }

        function hideSpinner(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }
    })();
</script>
</body>
</html>
