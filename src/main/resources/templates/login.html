<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Demo</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <!-- 头部 -->
        <div class="auth-header">
            <h1 class="auth-title">欢迎回来</h1>
            <p class="auth-subtitle">请使用您的账号登录</p>
        </div>

        <!-- 注册成功提示 -->
        <div id="successMessage" class="success-message" style="display: none;">
            <span class="success-icon">&#10003;</span>
            <span>注册成功！请使用新账号登录</span>
        </div>

        <!-- 错误提示区域 -->
        <div id="errorMessage" class="error-message" style="display: none;">
            <span class="error-icon">!</span>
            <span id="errorText"></span>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="auth-form" novalidate>
            <!-- 账号 -->
            <div class="form-group">
                <label for="account" class="form-label">账号</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input
                            type="text"
                            id="account"
                            name="account"
                            class="form-input"
                            placeholder="请输入用户名或邮箱"
                            autocomplete="username"
                            required
                    >
                </div>
                <span class="field-error" id="accountError"></span>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required
                    >
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="切换密码可见性">
                        <!-- 眼睛图标 - 关 -->
                        <svg id="eyeOff" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                        <!-- 眼睛图标 - 开 -->
                        <svg id="eyeOn" class="eye-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <span class="field-error" id="passwordError"></span>
            </div>

            <!-- 记住我 + 忘记密码 -->
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span class="checkmark"></span>
                    记住我
                </label>
                <a href="#" class="forgot-link">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" id="loginButton" class="btn-primary">
                <span id="buttonText">登 录</span>
                <span id="buttonLoader" class="loader" style="display: none;"></span>
            </button>
        </form>

        <!-- 底部链接 -->
        <div class="auth-footer">
            <p>还没有账号？<a href="/register" class="link">立即注册</a></p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    (function() {
        // 检查 URL 参数 ?registered=1，显示欢迎提示
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === '1') {
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'flex';
            // 清除 URL 参数
            window.history.replaceState({}, '', '/login');
            // 3秒后自动隐藏
            setTimeout(() => { successMsg.style.display = 'none'; }, 5000);
        }

        const loginForm = document.getElementById('loginForm');
        const accountInput = document.getElementById('account');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeOff = document.getElementById('eyeOff');
        const eyeOn = document.getElementById('eyeOn');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const buttonLoader = document.getElementById('buttonLoader');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const accountError = document.getElementById('accountError');
        const passwordError = document.getElementById('passwordError');

        let isSubmitting = false;

        // ---- 密码显隐切换 ----
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeOff.style.display = isPassword ? 'none' : 'block';
            eyeOn.style.display = isPassword ? 'block' : 'none';
        });

        // ---- 表单提交 ----
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (isSubmitting) return;

            // 清除之前的错误
            clearErrors();

            // 客户端非空校验
            const account = accountInput.value.trim();
            const password = passwordInput.value.trim();
            let hasError = false;

            if (!account) {
                showFieldError(accountError, '请输入账号');
                hasError = true;
            }
            if (!password) {
                showFieldError(passwordError, '请输入密码');
                hasError = true;
            }
            if (hasError) return;

            // 进入 loading 状态
            setLoading(true);

            const rememberMe = document.getElementById('rememberMe').checked;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    account: account,
                    password: password,
                    rememberMe: rememberMe
                })
            })
            .then(response => response.json())
            .then(data => {
                setLoading(false);

                if (data.code === 200) {
                    // 登录成功，跳转到 dashboard
                    window.location.href = '/dashboard';
                } else {
                    // 登录失败，显示统一错误消息
                    showGlobalError(data.message || '账号或密码错误');
                }
            })
            .catch(err => {
                setLoading(false);
                showGlobalError('网络异常，请稍后再试');
                console.error('Login error:', err);
            });
        });

        // ---- Loading 状态 ----
        function setLoading(loading) {
            isSubmitting = loading;
            loginButton.disabled = loading;
            buttonText.style.display = loading ? 'none' : 'inline';
            buttonLoader.style.display = loading ? 'inline-block' : 'none';
        }

        // ---- 错误显示 ----
        function showFieldError(element, message) {
            element.textContent = message;
            element.classList.add('visible');
        }

        function showGlobalError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'flex';
            errorMessage.classList.add('shake');
            setTimeout(() => errorMessage.classList.remove('shake'), 500);
        }

        function clearErrors() {
            errorMessage.style.display = 'none';
            accountError.textContent = '';
            accountError.classList.remove('visible');
            passwordError.textContent = '';
            passwordError.classList.remove('visible');
        }
    })();
</script>
</body>
</html>
