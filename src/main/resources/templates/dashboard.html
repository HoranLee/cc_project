<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - Demo</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="dashboard-container">
    <!-- 顶部导航 -->
    <header class="dashboard-header">
        <h1 class="logo">Demo</h1>
        <button id="logoutButton" class="btn-logout">
            <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            退出登录
        </button>
    </header>

    <!-- 主体内容 -->
    <main class="dashboard-main">
        <div class="welcome-card">
            <h2 class="welcome-title">
                欢迎回来，<span th:text="${user.nickname() ?: user.username()}">用户</span>！
            </h2>
            <p class="welcome-subtitle">这是您的个人仪表盘</p>
        </div>

        <!-- 用户信息卡片 -->
        <div class="info-card">
            <div class="info-card-header">
                <h3>个人信息</h3>
            </div>
            <div class="info-card-body">
                <div class="avatar-section">
                    <div class="avatar" th:style="'background-color:' + (${user.avatarUrl()} ? 'transparent' : '#4a90d9')">
                        <img th:if="${user.avatarUrl()}" th:src="${user.avatarUrl()}" alt="头像" class="avatar-img">
                        <span th:unless="${user.avatarUrl()}" class="avatar-text">
                            [[${user.nickname() != null ? #strings.substring(user.nickname(), 0, 1) : #strings.substring(user.username(), 0, 1)}]]
                        </span>
                    </div>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">用户名</span>
                        <span class="info-value" th:text="${user.username()}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">昵称</span>
                        <span class="info-value" th:text="${user.nickname() ?: '-'}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">邮箱</span>
                        <span class="info-value" th:text="${user.email()}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">最后登录时间</span>
                        <span class="info-value" th:text="${user.lastLoginTime() ?: '首次登录'}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">账号状态</span>
                        <span class="info-value">
                            <span class="status-badge" th:classappend="${user.status() == 1} ? 'status-active' : 'status-disabled'"
                                  th:text="${user.status() == 1} ? '正常' : '禁用'">正常</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 退出确认弹窗 -->
<div id="logoutModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-body">
            <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p class="modal-text">确认退出登录吗？</p>
        </div>
        <div class="modal-footer">
            <button id="cancelLogout" class="btn-secondary">取消</button>
            <button id="confirmLogout" class="btn-danger">确认退出</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    (function() {
        const logoutButton = document.getElementById('logoutButton');
        const logoutModal = document.getElementById('logoutModal');
        const cancelLogout = document.getElementById('cancelLogout');
        const confirmLogout = document.getElementById('confirmLogout');

        // ---- 退出确认弹窗 ----
        logoutButton.addEventListener('click', function() {
            logoutModal.style.display = 'flex';
        });

        cancelLogout.addEventListener('click', function() {
            logoutModal.style.display = 'none';
        });

        // 点击遮罩层关闭
        logoutModal.addEventListener('click', function(e) {
            if (e.target === logoutModal) {
                logoutModal.style.display = 'none';
            }
        });

        // ---- 确认退出 ----
        confirmLogout.addEventListener('click', function() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(response => response.json())
                .then(() => {
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        });
    })();
</script>
</body>
</html>
