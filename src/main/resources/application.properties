spring.application.name=demo

# 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/cc_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=hello
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT 配置
jwt.secret=YourSecretKeyForJWTMustBeAtLeast256BitsLongForHS256Algorithm2024Demo
jwt.expiration=1800000
jwt.remember-me-expiration=604800000

# Thymeleaf 配置
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
