spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cc_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: hello
    driver-class-name: com.mysql.cj.jdbc.Driver
