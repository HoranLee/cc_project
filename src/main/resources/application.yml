spring:
  application:
    name: demo
  threads:
    virtual:
      enabled: true               # Java 21 Virtual Threads
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: YourSecretKeyForJWTMustBeAtLeast256BitsLongForHS256Algorithm2024Demo
  expiration: 1800000              # 30 分钟
  remember-me-expiration: 604800000  # 7 天
